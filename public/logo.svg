<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a938b"/><stop offset="1" stop-color="#22625b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b272"/><stop offset="1" stop-color="#b8743a"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b2e2a" flood-opacity="0.35"/>
    </filter>
    <path id="heart" d="M0 30 C-52 -4 -34 -50 0 -22 C34 -50 52 -4 0 30 Z"/>
    <g id="spade"><path d="M0 -34 C-52 4 -34 48 0 18 C34 48 52 4 0 -34 Z"/><path d="M0 8 L-13 36 L13 36 Z"/></g>
    <g id="club"><circle cx="0" cy="-20" r="17"/><circle cx="-19" cy="6" r="17"/><circle cx="19" cy="6" r="17"/><path d="M0 0 L-12 36 L12 36 Z"/></g>
    <g id="diamond"><path d="M0 -36 L28 0 L0 36 L-28 0 Z"/></g>
    <g id="face"><rect x="-80" y="-115" width="160" height="230" rx="18" fill="#fff" stroke="#dde6e5" stroke-width="3"/></g>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- éventail de 4 cartes, pivot sous le centre ; chaque carte montre sa couleur en haut -->
  <g transform="translate(262 238)" filter="url(#sh)">
    <g transform="rotate(-33 0 150)"><use href="#face"/><use href="#spade" fill="#23323b" transform="translate(-40 -66) scale(0.72)"/></g>
    <g transform="rotate(-11 0 150)"><use href="#face"/><use href="#heart" fill="#d23c30" transform="translate(-40 -66) scale(0.72)"/></g>
    <g transform="rotate(11 0 150)"><use href="#face"/><use href="#club" fill="#23323b" transform="translate(-40 -66) scale(0.72)"/></g>
    <g transform="rotate(33 0 150)"><use href="#face"/><use href="#diamond" fill="#d23c30" transform="translate(-40 -66) scale(0.72)"/></g>
  </g>

  <!-- brosse à cheveux : palette jaune, coussin marron à picots, manche percé ; posée en diagonale -->
  <g transform="translate(262 350) rotate(-42) scale(0.86)" filter="url(#sh)">
    <path d="M-200 -24 Q-216 0 -200 24 L-40 36 Q-10 36 12 46 L12 -46 Q-10 -36 -40 -36 Z" fill="#ffb300"/>
    <circle cx="-176" cy="0" r="19" fill="#ff8f00"/><circle cx="-176" cy="0" r="9" fill="#fff4d6"/>
    <ellipse cx="92" cy="4" rx="118" ry="64" fill="#ffb300"/>
    <ellipse cx="86" cy="-4" rx="104" ry="52" fill="#8d6e63"/>
    <g stroke="#5d4037" stroke-width="16" stroke-linecap="round">
      <line x1="10" y1="-50" x2="10" y2="-18"/><line x1="40" y1="-62" x2="40" y2="-26"/><line x1="72" y1="-68" x2="72" y2="-30"/>
      <line x1="104" y1="-68" x2="104" y2="-30"/><line x1="136" y1="-62" x2="136" y2="-26"/><line x1="164" y1="-48" x2="164" y2="-18"/>
      <line x1="24" y1="-4" x2="24" y2="28"/><line x1="56" y1="-10" x2="56" y2="28"/><line x1="88" y1="-12" x2="88" y2="30"/>
      <line x1="120" y1="-10" x2="120" y2="28"/><line x1="152" y1="-4" x2="152" y2="24"/>
    </g>
  </g>
</svg>
